# This is a basic workflow to help you get started with Actions

name: test

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the develop branch
  push:
    branches: [master, develop]
    tags:
      - "*"
  pull_request:
    branches: [master, develop]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 25.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm babel

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Test with Vitest (Node.js and Browser)
        run: pnpm test:all

      - name: Install lcov and merge Vitest coverage info
        run: |
          sudo apt update
          sudo apt install lcov
          mkdir -p ./coverage
          find ./packages -name lcov.info -exec echo -a {} \; | xargs lcov -o ./coverage/merged-lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/merged-lcov.info

  webpage:
    needs: test
    if: ${{ (github.ref_name == 'master') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - run: |
          pnpm install --no-frozen-lockfile
          pnpm docs
          mv esdocs ~/docs

      - name: Setup git
        env:
          WEBPAGE_REPO_DEPLOY_KEY: ${{ secrets.WEBPAGE_REPO_DEPLOY_KEY }}
        run: |
          echo "$WEBPAGE_REPO_DEPLOY_KEY" > ~/deploy_key.pem
          chmod 600 ~/deploy_key.pem
          git config --global user.email "junkurihara@users.noreply.github.com"
          git config --global user.name "J via GitHub Actions"

      - name: Update and deploy pages
        env:
          GIT_SSH_COMMAND: ssh -i ~/deploy_key.pem -o StrictHostKeyChecking=no -F /dev/null
        run: |
          mkdir -p ~/jscu-webpage
          cd ~/jscu-webpage
          git clone git@github.com:junkurihara/jscu-webpage.git .
          rm -rf ./docs
          mv ~/docs ./docs
          git add .
          if ! git diff --cached --quiet; then
            echo 'Updated page and push via GitHub Actions'
            git commit -am 'Updated page and push via GitHub Actions'
            git push origin master
          fi

  publish:
    needs: test
    if: startsWith(github.event.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          # Defaults to the user or organization that owns the workflow file
          scope: "@octocat"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - run: |
          pnpm install --no-frozen-lockfile
          pnpm build
          bash scripts/publish.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Merge Dependabot's minor/patch updates automatically once the test job has passed.
  # Major updates are left for manual review, which mirrors the former Renovate policy.
  # A plain squash merge is used instead of GitHub's auto-merge feature because the
  # latter only waits for CI when the target branch has required status checks.
  dependabot-auto-merge:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Squash-merge minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        # --repo makes gh skip local branch handling, so --delete-branch only removes the remote branch.
        run: gh pr merge --squash --delete-branch --repo "$GITHUB_REPOSITORY" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
