packages:
  - 'packages/*'
# Always link workspace packages that satisfy the declared ranges. With the default (false),
# pnpm prefers the published registry copies, so tests would run against old releases instead
# of the local sources until a version bump makes the registry lookup fail.
linkWorkspacePackages: true
allowBuilds:
  '@parcel/watcher': false
  core-js: true
  nx: true
  pnpm: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@types/node@26.6.11'
  - '@vitest/browser-playwright@5.1.2'
  - '@vitest/browser@5.1.2'
  - '@vitest/coverage-v8@5.1.2'
  - '@vitest/mocker@5.1.2'
  - '@vitest/pretty-format@5.1.2'
  - '@vitest/spy@5.1.2'
  - '@vitest/ui@5.1.2'
  - '@vitest/utils@5.1.2'
  - vitest@5.1.2
